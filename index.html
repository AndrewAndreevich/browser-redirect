<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Check</title>
<style>
  * { box-sizing: border-box; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; font-family: system-ui, -apple-system, sans-serif;
    text-align: center; padding: 24px; gap: 14px;
  }
  body.ok  { background: #e8f9ee; color: #14532d; }
  body.bad { background: #fdeaea; color: #7f1d1d; }
  h2 { margin: 0; font-size: 25px; }
  p  { margin: 0; font-size: 17px; line-height: 1.45; max-width: 460px; }
  .badge { font-size: 60px; line-height: 1; }
  .btn {
    background: #2563eb; color: #fff; padding: 16px 30px; border-radius: 12px;
    text-decoration: none; font-weight: 600; font-size: 17px; border: none; display: inline-block;
  }
  .copy { background: none; border: none; color: #2563eb; font-size: 15px; padding: 6px; }
  .hint {
    font-size: 14px; opacity: .75; background: rgba(0,0,0,.05);
    padding: 12px 16px; border-radius: 10px; max-width: 460px;
  }
  details { margin-top: 22px; font-size: 12px; opacity: .6; max-width: 100%; width: 100%; }
  summary { cursor: pointer; }
  table { font-size: 11px; text-align: left; margin: 8px auto 0; border-collapse: collapse; }
  td { padding: 2px 8px; vertical-align: top; word-break: break-all; }
  td:first-child { opacity: .7; white-space: nowrap; }
  .yes { color: #b91c1c; font-weight: 600; }
  .no  { opacity: .45; }
</style>
<body>
<script>
(function () {
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var isDesktop = !isIOS && !isAndroid;

  // --- 1. Сторонние браузеры (честно метят себя в UA) ---
  var iosOtherBrowser     = /CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|YaBrowser|DuckDuckGo|Brave/.test(ua);
  var androidOtherBrowser = /Firefox|EdgA|OPR|SamsungBrowser|YaBrowser|Brave|UCBrowser|MiuiBrowser/.test(ua);

  // --- 2. In-app браузеры с меткой в UA ---
  var inAppUA = /(FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|Twitter|TikTok|Snapchat|VKAndroidApp|VKClient|OKApp|WhatsApp|Discord|Slack|LinkedInApp|Pinterest|GSA\/)/i.test(ua);

  // --- 3. Telegram и прочие: инжектят свои объекты ---
  var telegramObj = !!(window.TelegramWebviewProxy || window.TelegramWebview ||
                       (window.Telegram && (window.Telegram.WebApp || window.Telegram.WebView)));

  // --- 4. Android WebView ---
  // а) классический токен "; wv" (Telegram его убирает, но другие приложения оставляют)
  var wvToken = isAndroid && /;\s*wv[;)]/.test(ua);
  // б) Client Hints: WebView пишет бренд "Android WebView", настоящий Chrome — "Google Chrome".
  //    UA-строку приложение подменяет легко, бренды — нет.
  var uaData = navigator.userAgentData;
  var brands = (uaData && uaData.brands || []).map(function (b) { return b.brand; });
  var brandList = brands.join(', ');
  var brandWebView  = /WebView/i.test(brandList);
  var brandRealChrome = /Google Chrome/i.test(brandList);
  // в) в WebView нет Notification API — запасной признак, если Client Hints недоступны
  var noNotification = typeof window.Notification === 'undefined';

  var androidInApp = isAndroid && !androidOtherBrowser && (
        wvToken || brandWebView || telegramObj || inAppUA ||
        (brands.length ? !brandRealChrome : noNotification)
      );

  // --- 5. iOS WKWebView: UA как у Safari, но API другие ---
  // navigator.standalone есть только в приложении Safari, в WKWebView он undefined
  var noStandalone = isIOS && typeof navigator.standalone === 'undefined';
  // window.webkit.messageHandlers — мост «страница ↔ нативное приложение», в Safari его нет
  var wkHandlers = !!(window.webkit && window.webkit.messageHandlers);
  var iosInApp = isIOS && !iosOtherBrowser && (noStandalone || wkHandlers || telegramObj);

  var isInApp = iosInApp || androidInApp || (isDesktop && (inAppUA || telegramObj));

  var okIOS     = isIOS && !iosOtherBrowser && !isInApp;
  var okAndroid = isAndroid && /Chrome\/\d/.test(ua) && !androidOtherBrowser && !isInApp;
  var ok = okIOS || okAndroid || (isDesktop && !isInApp);

  var here   = location.host + location.pathname + location.search;
  var iosVer = (ua.match(/OS (\d+)[._]\d+/) || [])[1];
  var tooOld = isIOS && iosVer && +iosVer < 17;
  var target = isAndroid ? 'Chrome' : 'Safari';

  // ---------- диагностика ----------
  function flag(v) { return v ? '<span class="yes">да</span>' : '<span class="no">нет</span>'; }
  var debug =
    '<details><summary>Диагностика</summary><table>' +
    '<tr><td>платформа</td><td>' + (isIOS ? 'iOS ' + (iosVer || '?') : isAndroid ? 'Android' : 'desktop') + '</td></tr>' +
    '<tr><td>вердикт</td><td>' + (ok ? 'OK' : isInApp ? 'in-app браузер' : 'не тот браузер') + '</td></tr>' +
    '<tr><td>сторонний браузер (UA)</td><td>' + flag(iosOtherBrowser || androidOtherBrowser) + '</td></tr>' +
    '<tr><td>in-app токен в UA</td><td>' + flag(inAppUA) + '</td></tr>' +
    '<tr><td>Telegram-объект</td><td>' + flag(telegramObj) + '</td></tr>' +
    (isAndroid ?
      '<tr><td>токен ;wv</td><td>' + flag(wvToken) + '</td></tr>' +
      '<tr><td>бренды (Client Hints)</td><td>' + (brandList || '<span class="no">недоступны</span>') + '</td></tr>' +
      '<tr><td>бренд WebView</td><td>' + flag(brandWebView) + '</td></tr>' +
      '<tr><td>бренд Google Chrome</td><td>' + (brandRealChrome ? 'да' : '<span class="yes">нет</span>') + '</td></tr>' +
      '<tr><td>Notification API</td><td>' + (noNotification ? '<span class="yes">отсутствует</span>' : 'есть') + '</td></tr>'
      : '') +
    (isIOS ?
      '<tr><td>navigator.standalone</td><td>' + String(navigator.standalone) + '</td></tr>' +
      '<tr><td>webkit.messageHandlers</td><td>' + flag(wkHandlers) +
        (wkHandlers ? ' <span class="no">' + Object.keys(window.webkit.messageHandlers).slice(0, 6).join(', ') + '</span>' : '') + '</td></tr>'
      : '') +
    '<tr><td>UA</td><td>' + ua + '</td></tr>' +
    '</table></details>';

  var copyBtn =
    '<button class="copy" onclick="navigator.clipboard.writeText(location.href)' +
    '.then(function(){event.target.textContent=\'Скопировано ✓\'})">Скопировать ссылку</button>';

  // ---------- рендер ----------
  if (ok) {
    document.body.className = 'ok';
    document.body.innerHTML =
      '<div class="badge">✅</div>' +
      '<h2>Вы в корректном браузере</h2>' +
      '<p>' + (isIOS ? 'Настоящий Safari на iOS' : isAndroid ? 'Настоящий Chrome на Android' : 'Десктоп — ограничений нет') + '</p>' +
      debug;
    return;
  }

  var openUrl = isAndroid
    ? 'intent://' + here + '#Intent;scheme=' + location.protocol.replace(':', '') +
      ';package=com.android.chrome;S.browser_fallback_url=' +
      encodeURIComponent('https://play.google.com/store/apps/details?id=com.android.chrome') + ';end'
    : 'x-safari-https://' + here;

  document.body.className = 'bad';
  document.body.innerHTML =
    '<div class="badge">⚠️</div>' +
    '<h2>' + (isInApp ? 'Откройте страницу в браузере' : 'Этот браузер не поддерживается') + '</h2>' +
    '<p>' + (isInApp
      ? 'Сейчас страница открыта во встроенном браузере приложения. Для корректной работы нужен ' + target + '.'
      : 'Сайт корректно работает только в ' + target + '.') + '</p>' +
    (tooOld
      ? '<p>На вашей версии iOS автопереход недоступен — скопируйте ссылку и откройте её в Safari вручную.</p>'
      : '<a class="btn" href="' + openUrl + '">Открыть в ' + target + '</a>') +
    (isInApp
      ? '<p class="hint">Если кнопка не сработала — нажмите «•••» в углу приложения и выберите ' +
        '«Открыть в ' + target + '» / «Open in browser».</p>'
      : '') +
    copyBtn + debug;
})();
</script>
</body>
