<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Check</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<style>
  * { box-sizing: border-box; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; font-family: system-ui, -apple-system, sans-serif;
    text-align: center; padding: 24px; gap: 14px;
  }
  body.ok  { background: #e8f9ee; color: #14532d; }
  body.bad { background: #fdeaea; color: #7f1d1d; }
  h2 { margin: 0; font-size: 25px; }
  p  { margin: 0; font-size: 17px; line-height: 1.45; max-width: 460px; }
  .badge { font-size: 60px; line-height: 1; }
  .btn {
    background: #2563eb; color: #fff; padding: 16px 30px; border-radius: 12px;
    text-decoration: none; font-weight: 600; font-size: 17px; border: none; display: inline-block;
  }
  .copy { background: none; border: none; color: #2563eb; font-size: 15px; padding: 6px; }
  .hint {
    font-size: 14px; opacity: .75; background: rgba(0,0,0,.05);
    padding: 12px 16px; border-radius: 10px; max-width: 460px;
  }
  details { margin-top: 22px; font-size: 12px; opacity: .6; max-width: 100%; width: 100%; }
  summary { cursor: pointer; }
  table { font-size: 11px; text-align: left; margin: 8px auto 0; border-collapse: collapse; }
  td { padding: 2px 8px; vertical-align: top; word-break: break-all; }
  td:first-child { opacity: .7; white-space: nowrap; }
  .yes { color: #b91c1c; font-weight: 600; }
  .no  { opacity: .45; }
</style>
<body>
<script>
(function () {
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var isDesktop = !isIOS && !isAndroid;

  // --- 1. Сторонние браузеры (честно метят себя в UA) ---
  var iosOtherBrowser     = /CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|YaBrowser|DuckDuckGo|Brave/.test(ua);
  var androidOtherBrowser = /Firefox|EdgA|OPR|SamsungBrowser|YaBrowser|Brave|UCBrowser|MiuiBrowser/.test(ua);

  // --- 2. In-app браузеры с меткой в UA ---
  var inAppUA = /(FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|Twitter|TikTok|Snapchat|VKAndroidApp|VKClient|OKApp|WhatsApp|Discord|Slack|LinkedInApp|Pinterest|GSA\/)/i.test(ua);

  // --- 3. Telegram и прочие: инжектят свои объекты ---
  var telegramObj = !!(window.TelegramWebviewProxy || window.TelegramWebview ||
                       (window.Telegram && (window.Telegram.WebApp || window.Telegram.WebView)));

  // --- 4. Android WebView ---
  // а) классический токен "; wv" (Telegram его убирает, но другие приложения оставляют)
  var wvToken = isAndroid && /;\s*wv[;)]/.test(ua);
  // б) Client Hints: WebView пишет бренд "Android WebView", настоящий Chrome — "Google Chrome".
  //    UA-строку приложение подменяет легко, бренды — нет.
  var uaData = navigator.userAgentData;
  var brands = (uaData && uaData.brands || []).map(function (b) { return b.brand; });
  var brandList = brands.join(', ');
  var brandWebView  = /WebView/i.test(brandList);
  var brandRealChrome = /Google Chrome/i.test(brandList);
  // в) в WebView нет Notification API — запасной признак, если Client Hints недоступны
  var noNotification = typeof window.Notification === 'undefined';
  // г) Chrome Custom Tabs (так делает Telegram): это настоящий Chrome в окне приложения,
  //    все API хромовские, но реферрер выдаёт приложение-хозяина
  var ref = document.referrer || '';
  var appRef = /^android-app:\/\//.test(ref) ? ref : '';
  try {
    if (appRef) sessionStorage.setItem('appRef', appRef);
    else appRef = sessionStorage.getItem('appRef') || '';   // переживает переходы внутри сайта
  } catch (e) {}
  var refPackage = appRef.replace(/^android-app:\/\//, '').replace(/\/$/, '');
  var customTab = !!appRef;

  var androidInApp = isAndroid && !androidOtherBrowser && (
        wvToken || brandWebView || telegramObj || inAppUA || customTab ||
        (brands.length ? !brandRealChrome : noNotification)
      );

  // --- 5. iOS WKWebView: UA как у Safari, но API другие ---
  // navigator.standalone есть только в приложении Safari, в WKWebView он undefined
  var noStandalone = isIOS && typeof navigator.standalone === 'undefined';
  // window.webkit.messageHandlers — мост «страница ↔ нативное приложение», в Safari его нет
  var wkHandlers = !!(window.webkit && window.webkit.messageHandlers);
  var iosInApp = isIOS && !iosOtherBrowser && (noStandalone || wkHandlers || telegramObj);

  var isInApp = iosInApp || androidInApp || (isDesktop && (inAppUA || telegramObj));

  var okIOS     = isIOS && !iosOtherBrowser && !isInApp;
  var okAndroid = isAndroid && /Chrome\/\d/.test(ua) && !androidOtherBrowser && !isInApp;
  var ok = okIOS || okAndroid || (isDesktop && !isInApp);

  var here   = location.host + location.pathname + location.search;
  var iosVer = (ua.match(/OS (\d+)[._]\d+/) || [])[1];
  var tooOld = isIOS && iosVer && +iosVer < 17;
  var target = isAndroid ? 'Chrome' : 'Safari';

  // ---------- диагностика ----------
  var rows = [
    ['платформа',      isIOS ? 'iOS ' + (iosVer || '?') : isAndroid ? 'Android' : 'desktop'],
    ['вердикт',        ok ? 'OK' : isInApp ? 'in-app браузер' : 'не тот браузер'],
    ['сторонний браузер (UA)', iosOtherBrowser || androidOtherBrowser],
    ['in-app токен в UA',      inAppUA],
    ['Telegram-объект',        telegramObj]
  ];
  if (isAndroid) rows.push(
    ['токен ;wv',            wvToken],
    ['бренды (Client Hints)', brandList || '(недоступны)'],
    ['бренд WebView',        brandWebView],
    ['бренд Google Chrome',  brandRealChrome],
    ['Notification API',     noNotification ? '(отсутствует)' : 'есть'],
    ['реферрер приложения',  refPackage || '(нет)'],
    ['document.referrer',    ref || '(пусто)']
  );
  if (isIOS) rows.push(
    ['navigator.standalone', String(navigator.standalone)],
    ['webkit.messageHandlers', wkHandlers
      ? Object.keys(window.webkit.messageHandlers).slice(0, 8).join(', ') || 'есть' : false]
  );
  // максимальная высота окна, виденная на этом устройстве: у Custom Tabs панель выше,
  // чем у приложения Chrome, а хранилище у них общее — разница станет видна сразу
  var maxH = 0, firstSeen = '';
  try {
    maxH = +localStorage.getItem('maxInnerH') || 0;
    firstSeen = localStorage.getItem('firstSeen') || '';
    if (!firstSeen) { firstSeen = 'этот запуск'; localStorage.setItem('firstSeen', 'был раньше'); }
    if (window.innerHeight > maxH) { maxH = window.innerHeight; localStorage.setItem('maxInnerH', String(maxH)); }
  } catch (e) { firstSeen = 'localStorage недоступен'; }

  rows.push(
    ['предложение установки', '<span id="bip">жду 3 сек…</span>'],
    ['окно / экран', window.innerWidth + '×' + window.innerHeight + ' / ' + screen.width + '×' + screen.height],
    ['макс. высота окна', maxH + (maxH > window.innerHeight ? ' (сейчас на ' + (maxH - window.innerHeight) + 'px меньше)' : ' (сейчас максимум)')],
    ['localStorage', firstSeen],
    ['UA', ua]
  );

  var plain = rows.map(function (r) {
    return r[0] + ': ' + (r[1] === true ? 'да' : r[1] === false ? 'нет' : r[1]);
  }).join('\n');

  var debug =
    '<details open><summary>Диагностика</summary><table>' +
    rows.map(function (r) {
      var v = r[1] === true  ? '<span class="yes">да</span>'
            : r[1] === false ? '<span class="no">нет</span>'
            : r[1];
      return '<tr><td>' + r[0] + '</td><td>' + v + '</td></tr>';
    }).join('') +
    '</table>' +
    '<button class="copy" onclick="navigator.clipboard.writeText(' + JSON.stringify(plain) + ')' +
    '.then(function(){event.target.textContent=\'Диагностика скопирована ✓\'})">Скопировать диагностику</button>' +
    '</details>';

  var copyBtn =
    '<button class="copy" onclick="navigator.clipboard.writeText(location.href)' +
    '.then(function(){event.target.textContent=\'Скопировано ✓\'})">Скопировать ссылку</button>';

  // ---------- рендер ----------
  if (ok) {
    document.body.className = 'ok';
    document.body.innerHTML =
      '<div class="badge">✅</div>' +
      '<h2>Вы в корректном браузере</h2>' +
      '<p>' + (isIOS ? 'Настоящий Safari на iOS' : isAndroid ? 'Настоящий Chrome на Android' : 'Десктоп — ограничений нет') + '</p>' +
      debug;
    return;
  }

  var openUrl = isAndroid
    ? 'intent://' + here + '#Intent;scheme=' + location.protocol.replace(':', '') +
      ';package=com.android.chrome;S.browser_fallback_url=' +
      encodeURIComponent('https://play.google.com/store/apps/details?id=com.android.chrome') + ';end'
    : 'x-safari-https://' + here;

  document.body.className = 'bad';
  document.body.innerHTML =
    '<div class="badge">⚠️</div>' +
    '<h2>' + (isInApp ? 'Откройте страницу в браузере' : 'Этот браузер не поддерживается') + '</h2>' +
    '<p>' + (isInApp
      ? 'Сейчас страница открыта во встроенном браузере приложения. Для корректной работы нужен ' + target + '.'
      : 'Сайт корректно работает только в ' + target + '.') + '</p>' +
    (tooOld
      ? '<p>На вашей версии iOS автопереход недоступен — скопируйте ссылку и откройте её в Safari вручную.</p>'
      : '<a class="btn" href="' + openUrl + '">Открыть в ' + target + '</a>') +
    (isInApp
      ? '<p class="hint">Если кнопка не сработала — нажмите «•••» в углу приложения и выберите ' +
        '«Открыть в ' + target + '» / «Open in browser».</p>'
      : '') +
    copyBtn + debug;
})();

// ---- проверка возможностей: что среда реально умеет ----
// Надёжнее детекта браузера: не важно, что написано в UA, важно, работает ли AR/камера/гироскоп.
(function () {
  var box = document.createElement('details');
  box.open = true;
  box.innerHTML = '<summary>Возможности среды</summary><table id="caps"></table>' +
    '<button class="copy" id="capsCopy">Скопировать возможности</button>';
  document.body.appendChild(box);
  var table = box.querySelector('#caps');

  function row(name, value) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + name + '</td><td class="v">' + fmt(value) + '</td>';
    table.appendChild(tr);
    return tr.querySelector('.v');
  }
  function fmt(v) {
    if (v === true)  return '<span style="color:#15803d;font-weight:600">✅ есть</span>';
    if (v === false) return '<span class="yes">❌ нет</span>';
    return v;
  }
  function safe(fn) { try { return !!fn(); } catch (e) { return false; } }

  var checks = [
    ['WebGL2',              function () { return document.createElement('canvas').getContext('webgl2'); }],
    ['WebAssembly',         function () { return typeof WebAssembly === 'object'; }],
    ['SharedArrayBuffer',   function () { return typeof SharedArrayBuffer === 'function'; }],
    ['crossOriginIsolated', function () { return window.crossOriginIsolated; }],
    ['WebXR (navigator.xr)', function () { return 'xr' in navigator; }],
    ['AR Quick Look (rel=ar)', function () {
      var a = document.createElement('a');
      return a.relList && a.relList.supports && a.relList.supports('ar');
    }],
    ['getUserMedia (камера)', function () { return navigator.mediaDevices && navigator.mediaDevices.getUserMedia; }],
    ['DeviceOrientation',   function () { return 'DeviceOrientationEvent' in window; }],
    ['запрос доступа к гироскопу (iOS)', function () {
      return typeof (window.DeviceOrientationEvent || {}).requestPermission === 'function';
    }],
    ['Fullscreen API',      function () {
      var d = document.documentElement;
      return d.requestFullscreen || d.webkitRequestFullscreen;
    }],
    ['Service Worker',      function () { return 'serviceWorker' in navigator; }],
    ['Notification',        function () { return 'Notification' in window; }],
    ['clipboard.writeText', function () { return navigator.clipboard && navigator.clipboard.writeText; }]
  ];

  var results = {};
  checks.forEach(function (c) {
    results[c[0]] = safe(c[1]);
    row(c[0], results[c[0]]);
  });

  // асинхронные проверки
  var arCell = row('WebXR immersive-ar', 'проверяю…');
  var vrCell = row('WebXR immersive-vr', 'проверяю…');
  var camCell = row('камер в системе', 'проверяю…');
  var verdictCell = row('<b>AR доступен</b>', 'проверяю…');

  function xr(mode, cell, done) {
    if (!navigator.xr || !navigator.xr.isSessionSupported) {
      cell.innerHTML = fmt(false); results[mode] = false; return done();
    }
    navigator.xr.isSessionSupported(mode).then(function (v) {
      cell.innerHTML = fmt(!!v); results[mode] = !!v; done();
    }, function (e) {
      cell.innerHTML = '<span class="yes">❌ ошибка: ' + e.name + '</span>'; results[mode] = false; done();
    });
  }

  var pending = 2;
  function finish() {
    if (--pending) return;
    var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    // на Android AR идёт через WebXR, на iOS — через AR Quick Look (USDZ)
    var arOk = isIOS ? results['AR Quick Look (rel=ar)'] : results['immersive-ar'];
    verdictCell.innerHTML = arOk
      ? '<span style="color:#15803d;font-weight:600">✅ да</span>'
      : '<span class="yes">❌ нет — этот браузер AR не потянет</span>';
  }
  xr('immersive-ar', arCell, finish);
  xr('immersive-vr', vrCell, finish);

  if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
    navigator.mediaDevices.enumerateDevices().then(function (list) {
      camCell.textContent = list.filter(function (d) { return d.kind === 'videoinput'; }).length;
    }, function () { camCell.textContent = 'ошибка'; });
  } else {
    camCell.innerHTML = fmt(false);
  }

  document.getElementById('capsCopy').onclick = function () {
    var text = [].map.call(table.rows, function (r) {
      return r.cells[0].textContent + ': ' + r.cells[1].textContent;
    }).join('\n');
    navigator.clipboard.writeText(text).then(function () {
      document.getElementById('capsCopy').textContent = 'Скопировано ✓';
    });
  };
})();

// ---- проверка beforeinstallprompt ----
// Приложение Chrome предлагает установить сайт на домашний экран, Custom Tabs — нет.
// Событие приходит асинхронно, поэтому строку в таблице обновляем отдельно.
(function () {
  var fired = false;
  function set(text, bad) {
    var el = document.getElementById('bip');
    if (el) el.innerHTML = bad ? '<span class="yes">' + text + '</span>' : text;
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    fired = true;
    set('пришло (приложение Chrome)');
  });
  setTimeout(function () { if (!fired) set('не пришло (Custom Tabs / уже установлено)', true); }, 3000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
